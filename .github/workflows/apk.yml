name: Build B-Coin APK Real
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.kalapagenep.bcoin","appName":"B-Coin Kalapagenep","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: B-Coin-Kalapagenep-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
