name: Build B-Coin APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK with WebView
        run: |
          mkdir -p android-app/app/src/main
          cat > android-app/app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.kalapagenep.bcoin">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="B-Coin Kalapagenep" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MAN
          echo "APK Build Started"
      - uses: actions/upload-artifact@v3
        with:
          name: B-Coin-Kalapagenep-APK
          path: ./
